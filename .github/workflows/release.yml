name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and build without publishing (publishing requires a version tag)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.5"
          python-version: "3.12"
      - name: Verify version, source, and release notes
        id: version
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $publish = $env:GITHUB_REF_TYPE -eq "tag" -and $env:DRY_RUN -ne "true"
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:DRY_RUN -ne "true" -and $env:GITHUB_REF_TYPE -ne "tag") {
            throw "Publishing requires a version tag; select a tag or enable dry_run."
          }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw "Expected a vX.Y.Z tag" }
            $version = $env:GITHUB_REF_NAME.Substring(1)
            git merge-base --is-ancestor HEAD "origin/$env:DEFAULT_BRANCH"
            if ($LASTEXITCODE -ne 0) { throw "Release tags must point to a commit on the default branch" }
          } else {
            $version = (Select-String -Path python/src/wintestkit/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          }
          uv run --no-project python scripts/bump_version.py --check $version
          if ($LASTEXITCODE -ne 0) { throw "Tag and file versions differ" }
          uv run --no-project python scripts/check_release.py compatibility
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-project python scripts/check_release.py notes $version --output release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $publish) {
            "Dry run: versions, changelog, tests, and packages are validated. Publishing credentials and registry authorization are not exercised." >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  preflight:
    needs: [version, checks]
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.5"
          python-version: "3.12"
      - name: Require configuration for every enabled registry
        env:
          PUBLISH_PYPI: ${{ vars.PUBLISH_PYPI }}
          PUBLISH_OVSX: ${{ vars.PUBLISH_OVSX }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: uv run --no-project python scripts/check_release.py config

  vsix:
    needs: [version, checks]
    runs-on: windows-latest
    strategy:
      matrix:
        target: [win32-x64, win32-arm64]
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Package with the locked publishing tool
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: npm exec --no -- vsce package --target $env:TARGET -o "dist/wintestkit-$env:TARGET-$env:VERSION.vsix"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vsix-${{ matrix.target }}
          path: vscode/dist/*.vsix
          if-no-files-found: error

  publish-pypi:
    needs: [version, checks, vsix, preflight]
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-dist
          path: artifacts
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.5"
      - name: Publish tested distributions
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ (Get-ChildItem artifacts -File).FullName

  publish-marketplace:
    needs: [version, checks, vsix, preflight, publish-pypi]
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: vsix-*
          path: vscode/artifacts
          merge-multiple: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci --ignore-scripts
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish built packages without rebuilding
        run: npm exec --no -- vsce publish --azure-credential --skip-duplicate --packagePath (Get-ChildItem artifacts -Filter *.vsix).FullName

  github-release:
    needs: [version, publish-pypi, publish-marketplace]
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-dist
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: vsix-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-notes
          path: notes
      - name: Create or recover the GitHub Release after both registries succeed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME (Get-ChildItem artifacts -File).FullName --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME (Get-ChildItem artifacts -File).FullName --verify-tag --title "WinTestKit $env:VERSION" --notes-file notes/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish-openvsx:
    needs: [version, github-release]
    if: needs.version.outputs.publish == 'true' && vars.PUBLISH_OVSX == 'true'
    runs-on: windows-latest
    environment: release
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: vsix-*
          path: vscode/artifacts
          merge-multiple: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Publish optional Open VSX packages
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
        run: npm exec --no -- ovsx publish --skip-duplicate --packagePath (Get-ChildItem artifacts -Filter *.vsix).FullName
