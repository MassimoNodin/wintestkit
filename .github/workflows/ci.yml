name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Install dependencies
        working-directory: .
        run: uv sync --directory python --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check release helpers
        run: |
          uv run ruff check ../scripts/check_release.py ../scripts/bump_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff format --check ../scripts/check_release.py ../scripts/bump_version.py
      - name: Check compatibility policy
        run: uv run python ../scripts/check_release.py compatibility
      - name: Check types
        run: uv run pyright
      - name: Run unit tests
        run: uv run pytest -m "not integration" --junitxml=junit-python.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-test-results
          path: python/junit-python.xml
          if-no-files-found: warn
      - name: Check wheel
        working-directory: .
        run: ./scripts/check_wheel.ps1
      - name: Upload Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-dist
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
          if-no-files-found: error

  extension:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check generated protocol types
        if: hashFiles('schemas/*.schema.json') != ''
        run: |
          git ls-files --error-unmatch src/protocol/generated.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run gen:types
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code src/protocol/generated.ts
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Package extension
        run: npm run package
      - name: Upload extension
        if: vars.PUBLISH_PUBLIC_VSIX == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vscode-extension
          path: vscode/dist/*.vsix
          if-no-files-found: error

  inspector-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.12.5"
          python-version: "3.12"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: wpf-inspector/global.json
      - name: Install .NET Framework developer pack
        run: choco install netfx-4.8-devpack -y
      - name: Build payload
        run: ./scripts/build_inspector.ps1 -Configuration Release -LockedRestore
      - name: Unit tests
        run: |
          $projects = @('wpf-inspector/WinTestKit.Inspector.sln', 'wpf-inspector/tests/Unit/Agent.Session.Tests/Agent.Session.Tests.csproj', 'wpf-inspector/tests/Unit/Agent.Mapping.Tests/Agent.Mapping.Tests.csproj', 'wpf-inspector/tests/Unit/Agent.Members.Tests/Agent.Members.Tests.csproj')
          foreach ($project in $projects) {
            dotnet test $project -c Release --filter Category=Unit --logger trx --results-directory "${{ github.workspace }}/inspector-results/$([IO.Path]::GetFileNameWithoutExtension($project))"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check package
        run: ./scripts/check_inspector.ps1 -Suite Package
      - name: Build inspector wheel
        run: |
          uv build --directory inspector-payload --wheel --out-dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem inspector-payload/dist/*.whl)
          if ($wheels.Count -ne 1 -or $wheels[0].Name -notmatch '-py3-none-win_amd64\.whl$') { throw 'Unexpected inspector wheel tag' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: inspector-results
          path: |
            inspector-results/**/*.trx
            inspector-payload/dist/*.whl
          if-no-files-found: warn
