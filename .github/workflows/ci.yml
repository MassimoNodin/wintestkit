name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Install dependencies
        working-directory: .
        run: uv sync --directory python --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Check release helpers
        run: |
          uv run ruff check ../scripts/check_release.py ../scripts/bump_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff format --check ../scripts/check_release.py ../scripts/bump_version.py
      - name: Check compatibility policy
        run: uv run python ../scripts/check_release.py compatibility
      - name: Check types
        run: uv run pyright
      - name: Run unit tests
        run: uv run pytest -m "not integration" --junitxml=junit-python.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-test-results
          path: python/junit-python.xml
          if-no-files-found: warn
      - name: Check wheel
        working-directory: .
        run: ./scripts/check_wheel.ps1
      - name: Upload Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-dist
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
          if-no-files-found: error

  extension:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check generated protocol types
        if: hashFiles('schemas/*.schema.json') != ''
        run: |
          git ls-files --error-unmatch src/protocol/generated.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run gen:types
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code src/protocol/generated.ts
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Package extension
        run: npm run package
      - name: Upload extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vscode-extension
          path: vscode/dist/*.vsix
          if-no-files-found: error
