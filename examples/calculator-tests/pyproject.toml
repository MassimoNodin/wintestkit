[project]
name = "calculator-tests"
version = "0.0.0"
description = "Windows Calculator pages, reusable flows and pytest scenarios"
requires-python = ">=3.12"
dependencies = ["wintestkit", "pytest>=8.3"]

[tool.uv]
package = false

[tool.uv.sources]
wintestkit = { path = "../../python", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "smoke: basic Calculator interactions",
    "navigation: moving between Calculator pages",
]

[tool.wintestkit]
launch = "attach"
timeout = 10.0
screenshots = "on-failure"

[tool.wintestkit.app]
process = "CalculatorApp.exe"

[tool.pyright]
include = ["conftest.py", "pages", "flows", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
