<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WinTestKit Test Report</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#16181d;--muted:#5f6670;--faint:#9aa1ab;--line:#e3e6ea;--soft:#f1f3f6;
  --blue:#1a66d9;--blue-soft:#e8f0fd;--red:#d42a1f;--red-soft:#fdeceb;--green:#1f8f4e;--green-soft:#e7f5ec;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#121417;--card:#1a1d21;--ink:#e8eaed;--muted:#a0a7b1;--faint:#6b727c;--line:#2c3036;--soft:#22262b;
  --blue:#5b9bff;--blue-soft:#1d2a40;--red:#ff6157;--red-soft:#3a1f1e;--green:#4fbf7a;--green-soft:#1b3125;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}

/* top bar */
.top{height:56px;flex:none;display:flex;align-items:center;gap:20px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;white-space:nowrap}
.brand b{font-weight:600}
.logo{display:block;flex:none}
.runinfo{color:var(--muted);font-size:13px;white-space:nowrap}
.counts{margin-left:auto;display:flex;align-items:center;gap:22px}
.theme-toggle{flex:none;display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--muted)}
.theme-toggle:hover{background:var(--soft);color:var(--ink)}
.theme-toggle svg{display:block}
.count{display:flex;align-items:center;gap:8px;line-height:1.15}
.count small{display:block;color:var(--muted);font-size:12px}
.count b{font-size:17px;font-weight:600}
.count+.count.total{padding-left:22px;border-left:1px solid var(--line)}

/* layout */
.app{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr) 76px 400px}
.app.panel-closed{grid-template-columns:280px minmax(0,1fr) 76px}
.app.panel-closed .panel{display:none}
.app.replay{grid-template-columns:1fr}
.app.replay>:not(.replayview){display:none}

/* sidebar */
.side{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side h2{font-size:15px;font-weight:600;margin:16px 16px 10px}
.search{margin:0 16px 10px;position:relative}
.search input{width:100%;padding:7px 10px 7px 32px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.tree-nav{overflow:auto;padding:0 8px 16px;flex:1}
.file{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;padding:6px 8px;border-radius:6px;text-align:left;font-weight:500}
.file:hover{background:var(--soft)}
.chev{width:14px;height:14px;color:var(--muted);transition:transform .12s;flex:none}
.file[aria-expanded=false] .chev{transform:rotate(-90deg)}
.file .fails{margin-left:auto;color:var(--red);font-size:12px;font-weight:400}
.test{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:5px 8px 5px 34px;border-radius:6px;text-align:left}
.test:hover{background:var(--soft)}
.test.sel{background:var(--blue-soft)}
.test .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.test .dur{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--green)}
.dot.failed{background:var(--red)}.dot.skipped{background:var(--faint)}
.empty-nav{padding:12px 8px;color:var(--muted)}

/* main */
.main{overflow:auto;padding:24px 28px 40px;min-width:0}
.title{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.title h1{font-size:24px;font-weight:600;margin:0;word-break:break-all}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 6px;border-radius:999px;font-weight:600;font-size:13.5px;color:#fff;background:var(--red)}
.badge.passed{background:var(--green)}.badge.skipped{background:var(--faint)}
.actions{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:6px;font-size:13px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500;padding:9px 16px;font-size:14px}
.btn.primary:hover{filter:brightness(1.08)}
:root[data-theme=dark] .btn.primary,:root[data-theme=dark] .ctl.play{color:#0d1726}
.btn.done{color:var(--green)}
.meta{display:flex;flex-wrap:wrap;margin:8px 0 20px;color:var(--muted)}
.meta>span{display:inline-flex;align-items:center;gap:6px}
.meta span+span::before{content:"";display:inline-block;width:1px;height:14px;background:var(--line);margin:0 14px;vertical-align:-2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:18px}
.card>h3{font-size:17px;font-weight:600;margin:0;padding:14px 18px}
.broke{display:grid;grid-template-columns:minmax(220px,1fr) minmax(280px,1.25fr);gap:22px;padding:18px}
.broke h3{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;margin:0 0 16px}
.lbl{font-weight:600;margin:0 0 6px;font-size:13.5px}
.chip{display:inline-block;background:var(--red-soft);color:var(--red);padding:4px 10px;border-radius:5px;font-weight:500}
.field{margin-bottom:16px}
.loc{background:var(--soft);border-radius:5px;padding:6px 9px;display:block;word-break:break-all}
.shotbox{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft);padding:10px;align-self:start}
.shotbox svg{display:block;width:100%;height:auto}
.shotcap{font-size:12px;color:var(--muted);margin-top:6px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 14px;border-top:1px solid var(--line)}
th{font-weight:600;background:var(--soft)}
td.n,th.n{width:44px;text-align:center;color:var(--muted)}
td.st,th.st{width:70px;text-align:center}
td.d,th.d{width:110px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
tr.failed td{color:var(--red);font-weight:600}
tr.failed td.n{color:var(--red)}
tr.notrun td{color:var(--faint)}
.stepsub{display:block;font-weight:400;font-size:12px;color:var(--muted);font-family:var(--mono)}
tr.failed .stepsub{color:var(--red);opacity:.85}
.skipbox{padding:18px}
.passnote{padding:14px 18px;color:var(--muted);border-top:1px solid var(--line)}

/* rail + panel */
.rail{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:8px}
.rail button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 2px;font-size:12px;color:var(--muted);border-left:3px solid transparent}
.rail button:hover{color:var(--ink)}
.rail button.on{color:var(--blue);background:var(--blue-soft);border-left-color:var(--blue)}
.rail button .pip{width:6px;height:6px;border-radius:50%;background:var(--red);position:absolute;margin:-2px 0 0 18px}
.panel{background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:18px}
.phead{display:flex;align-items:flex-start;gap:8px}
.phead h2{font-size:19px;font-weight:600;margin:0}
.phead .x{margin-left:auto;border:0;background:none;color:var(--muted);padding:2px;border-radius:4px}
.phead .x:hover{background:var(--soft);color:var(--ink)}
.psub{color:var(--muted);font-size:13px;margin:4px 0 16px}
.box{border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.box>h4{margin:0;padding:10px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line)}
.kv{margin:0;display:grid;grid-template-columns:130px 1fr;gap:6px 12px;padding:12px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.kv.soft{background:var(--soft);border-radius:8px;margin-bottom:16px}
.sec{font-size:15px;font-weight:600;margin:4px 0 10px}
.cand{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:12px;cursor:pointer}
.cand.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.cand .row{display:flex;align-items:center;gap:10px}
.rank{width:24px;height:24px;border-radius:5px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.bar{flex:1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.pct{font-variant-numeric:tabular-nums;width:38px;text-align:right}
.cand .props{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;font-size:13px;margin-top:10px}
.cand .props dt{color:var(--muted)}.cand .props dd{margin:0}
.bad{color:var(--red);font-weight:600}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:4px;background:var(--green-soft);color:var(--green);margin-right:4px}
.tag.off{background:var(--soft);color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin:12px -12px -12px;background:var(--soft);border-radius:0 0 8px 8px}
.cmp>div{padding:10px 12px;font-size:12.5px}
.cmp>div+div{border-left:1px solid var(--line)}
.cmp h5{margin:0 0 6px;font-size:12.5px}
.cmp dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:0}
.cmp dt{color:var(--muted)}.cmp dd{margin:0;word-break:break-all}
.hint{border-left:3px solid var(--blue);background:var(--blue-soft);padding:10px 12px;border-radius:0 6px 6px 0;margin-bottom:16px;font-size:13.5px}
.hint .loc{background:var(--card);margin:8px 0}
.ok{display:flex;gap:10px;align-items:center;color:var(--muted);padding:20px 0}
.exp{font-family:var(--mono);font-size:13px}
.exp ins{text-decoration:none;background:var(--green-soft);color:var(--green);font-weight:600}
.exp del{text-decoration:none;background:var(--red-soft);color:var(--red);font-weight:600}

/* ui tree */
.ttree{border:1px solid var(--line);border-radius:8px;padding:8px 6px;font-size:13.5px;overflow-x:auto}
.tnode{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;cursor:pointer;white-space:nowrap}
.tnode:hover{background:var(--soft)}
.tnode.sel{background:var(--blue-soft)}
.tnode.hit{color:var(--blue);font-weight:600}
.tnode.dim{color:var(--faint)}
.tnode .tw{width:14px;flex:none;color:var(--muted);display:grid;place-items:center}
.tnode .ci{display:grid;flex:none;color:var(--muted)}.tnode.hit .ci{color:inherit}.tnode.dim .ci{color:var(--faint)}
.tnode .ct{color:var(--muted)}.tnode.hit .ct{color:inherit}
.tnode .aid{color:var(--faint);font-family:var(--mono);font-size:11.5px}
.tnode .flag{font-size:12px;color:var(--faint)}
.tnode .target{display:flex;margin-left:auto;font-size:11.5px;color:var(--blue);font-weight:500}
mark{background:#ffe58a;color:#000;border-radius:2px}

/* output */
.seg{display:flex;background:var(--soft);border-radius:8px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:6px;border-radius:6px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px #0002}
.seg button:disabled{opacity:.45;cursor:default}
.seg button .ct{font-weight:400;color:var(--faint);margin-left:4px}
.ohead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ohead b{font-size:14px}.ohead .btn{margin-left:auto;padding:3px 9px;font-size:12.5px}
.log{border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:12px;padding:6px 0;overflow:auto}
.log div{display:grid;grid-template-columns:32px 1fr;padding:1px 10px 1px 0;white-space:pre-wrap;word-break:break-word}
.log div::before{content:attr(data-n);color:var(--faint);text-align:right;padding-right:10px}
.log .ERROR{color:var(--red)}.log .WARNING{font-weight:700}.log .DEBUG{color:var(--faint)}
.noout{color:var(--muted);padding:16px 0}

/* replay */
.replayview{overflow:auto;padding:18px 28px 28px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--blue);background:none;border:0;padding:0;font-size:15px}
.trhead{max-width:1100px;margin:14px auto 14px}
.trhead h1{font-size:24px;font-weight:600;margin:0}
.stage{max-width:1100px;margin:0 auto;display:grid;place-items:center;min-height:120px}
.stage img{border-radius:8px;box-shadow:0 0 0 1px var(--line),0 6px 24px #0003}
.card.broke.ok-card{grid-template-columns:minmax(0,1fr)}.okline{margin:0 0 16px}.ok-card .muted{margin:0}
.stage .nr{padding:40px;border:1px dashed var(--line);border-radius:10px;width:100%}
.stage svg{width:min(100%,760px);height:auto;filter:drop-shadow(0 4px 14px #0002)}
.stage .nr{color:var(--muted);text-align:center}
.caption{max-width:1100px;height:92px;margin:10px auto 0;display:flex;gap:6px 10px;align-items:center;align-content:flex-start;flex-wrap:wrap;overflow-y:auto}
.caption .err{flex-basis:100%;overflow-wrap:anywhere}
.caption svg{display:block}
.legend{display:flex;align-items:center;gap:6px}.legend svg{display:block;flex:none}
.caption .err{color:var(--red)}
.controls{max-width:1100px;margin:16px auto 14px;display:flex;align-items:center;gap:10px}
.ctl{width:40px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:6px;display:grid;place-items:center}
.ctl.play{background:var(--blue);border-color:var(--blue);color:#fff;width:56px}
.time{font-variant-numeric:tabular-nums;margin:0 8px;white-space:nowrap}
.track{flex:1;height:22px;position:relative;cursor:pointer;margin:0 12px}
.track .rail2{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--line)}
.track .fill{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:var(--blue)}
.track .tick{position:absolute;top:6px;width:10px;height:10px;border-radius:50%;margin-left:-5px;background:var(--green);border:2px solid var(--card)}
.track .tick.failed{background:var(--red);width:14px;height:14px;top:4px;margin-left:-7px}
.track .tick.not_run{background:var(--faint)}
.track .head{position:absolute;top:2px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--blue);border:3px solid var(--card);box-shadow:0 0 0 1px var(--blue)}
.track .head.failed{background:var(--red);box-shadow:0 0 0 1px var(--red)}
.speed{height:36px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);padding:0 6px;font:inherit}
.thumb:disabled{cursor:default}
.track{touch-action:none}
.jump{border:0;background:var(--red-soft);color:var(--red);font-weight:600;padding:8px 14px;border-radius:6px;display:flex;gap:8px;align-items:center}
.thumbs{max-width:1100px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(130px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.thumb{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px;text-align:left;font-size:12.5px}
.thumb svg,.thumb .blank{display:block;width:100%;aspect-ratio:16/10;border-radius:4px;background:var(--soft)}
.thumb .blank{display:grid;place-items:center;color:var(--faint)}
.thumb .tn{margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .td{color:var(--muted)}
.thumb.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.thumb.failed .tn{color:var(--red);font-weight:600}
.thumb.failed.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red);background:var(--red-soft)}
.thumb.not_run{opacity:.6}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}

svg{vertical-align:middle;flex-shrink:0}.shotbox img,.stage img{display:block;max-width:100%;height:auto}.stage img{max-height:580px;object-fit:contain}.thumb img{width:100%;aspect-ratio:16/10;object-fit:contain;background:var(--soft)}.file>span:not(.fails){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stepsub,.props dd{overflow-wrap:anywhere}.main pre,.panel pre{white-space:pre-wrap;overflow-wrap:anywhere}td.st svg{display:block;margin:auto}.broke{grid-template-columns:minmax(0,1fr) minmax(180px,40%)}.panel{min-width:0}.thumb{min-width:0}tr.not_run td{color:var(--faint)}
@media(max-width:1150px){.app{grid-template-columns:220px minmax(0,1fr) 76px 330px}.app.panel-closed{grid-template-columns:220px minmax(0,1fr) 76px}.runinfo{white-space:normal}.counts{gap:12px}.main{padding:18px}.broke{grid-template-columns:1fr}}
.app:not(.replay)>.replayview{display:none}.app.replay,.app.replay.panel-closed{grid-template-columns:1fr}
</style>
</head>

<script>
/* Follows the VS Code or system theme until the user picks one; the pick is remembered. */
const theme=(()=>{
  const root=document.documentElement,key="wtk-report-theme",valid=v=>v==="light"||v==="dark";
  const host=typeof acquireVsCodeApi==="function"?acquireVsCodeApi():null;
  const meta=document.querySelector("meta[name=\"wtk-theme\"]");
  let chosen=meta&&valid(meta.content)?meta.content:null;
  if(!chosen&&!host)try{const saved=localStorage.getItem(key);if(valid(saved))chosen=saved}catch{}
  const media=matchMedia("(prefers-color-scheme: dark)"),listeners=[];
  const ambient=()=>{const c=document.body.classList;
    if(c.contains("vscode-high-contrast-light")||c.contains("vscode-light"))return"light";
    if(c.contains("vscode-dark")||c.contains("vscode-high-contrast"))return"dark";
    return media.matches?"dark":"light"};
  const apply=()=>{root.dataset.theme=chosen||ambient();listeners.forEach(f=>f(root.dataset.theme))};
  new MutationObserver(()=>{if(!chosen)apply()}).observe(document.body,{attributes:true,attributeFilter:["class"]});
  media.addEventListener("change",()=>{if(!chosen)apply()});
  apply();
  return{get:()=>root.dataset.theme,onChange:f=>listeners.push(f),inVsCode:!!host,post:message=>host?.postMessage(message),
    set(value){chosen=value;apply();
      if(host)host.postMessage({type:"wtk-theme",theme:value});
      else try{localStorage.setItem(key,value)}catch{}}};
})();

/* Plays the recorded frames on their own clock: each frame stays up until the next one was
   captured, so the replay keeps the pace of the real run. Steps are markers on that clock. */
const SPEEDS=[0.5,1,2,4];
const framePath=path=>path.replace(/\\/g,'/');
function timeline(t){
  if(t._timeline)return t._timeline;
  const frames=t.frames.map(frame=>({time:Math.max(0,Number(frame.time)||0),path:frame.path})).sort((a,b)=>a.time-b.time);
  const marks=t.steps.map((step,index)=>({...step,index,start:step.at,end:step.at==null?null:step.at+step.dur}));
  const total=Math.max(Number(t.replay?.duration)||0,frames.at(-1)?.time||0,...marks.map(mark=>mark.end||0),0.1);
  return t._timeline={frames,marks,total};
}
function frameAt(frames,time){let low=0,high=frames.length-1,found=0;
  while(low<=high){const mid=(low+high)>>1;if(frames[mid].time<=time){found=mid;low=mid+1}else high=mid-1}return found}
const markAt=(marks,time)=>marks.reduce((found,mark,index)=>mark.start!=null&&mark.start<=time+1e-3?index:found,-1);
const preloaded=new Map();
function preload(path){if(preloaded.has(path))return;const img=new Image();img.decoding='async';img.src=path;preloaded.set(path,img)}
/* A step opens at its start so playing it shows the action; the failure opens at the moment it failed. */
function replayTimeFor(t,index){const{marks,total}=timeline(t),mark=marks[index];
  if(!mark||mark.start==null)return total;
  return mark.status==='failed'?Math.max(mark.start,mark.end-0.001):mark.start}
function openReplayAt(at){$('#replay').scrollTop=0;st.view='replay';st.at=at;render()}
function openReplay(index){$('#replay').scrollTop=0;st.view='replay';st.at=replayTimeFor(cur(),index);render()}
let replayUi=null;
function stopPlay(){if(st.playing!=null)cancelAnimationFrame(st.playing);st.playing=null;if(st.view==='replay')replayUi?.update(true)}
function renderTrace(){
  const t=cur(),box=$('#replay');box.replaceChildren();
  const{frames,marks,total}=timeline(t),failed=marks.find(mark=>mark.status==='failed');
  st.at=Math.max(0,Math.min(total,Number.isFinite(st.at)?st.at:0));
  /* Two ways to lay out the track. By time (the default) a dot sits where its step really started and
     the playhead moves at a constant speed. Equal steps spaces the dots evenly and the playhead crosses
     each gap in proportion to the time that step took, so quick steps stay easy to click. */
  const byTime=st.spacing!=='steps';
  const timed=marks.filter(mark=>mark.start!=null);
  const anchors=timed.reduce((list,mark)=>[...list,Math.max(mark.start,(list.at(-1)??-1)+1e-3)],[]);
  anchors.push(Math.max(total,(anchors.at(-1)??0)+1e-3));
  const segments=timed.length;
  const place=at=>{if(byTime||!segments)return Math.min(1,at/total);if(at<=anchors[0])return 0;
    let i=0;while(i<segments-1&&at>=anchors[i+1])i++;
    return Math.min(1,(i+Math.min(1,(at-anchors[i])/(anchors[i+1]-anchors[i])))/segments)};
  const timeAt=fraction=>{if(byTime||!segments)return Math.max(0,Math.min(1,fraction))*total;const scaled=Math.max(0,Math.min(1,fraction))*segments,i=Math.min(segments-1,Math.floor(scaled));
    return anchors[i]+(scaled-i)*(anchors[i+1]-anchors[i])};
  const counter=el('span'),stamp=el('span'),time=el('span',{class:'time'}),caption=el('div',{class:'caption'});
  box.append(el('div',{class:'trhead'},el('button',{class:'back',onclick:()=>{stopPlay();st.view='test';render()}},svg(ICON.left),'Back to test'),
    el('h1',{style:'margin-top:12px',text:'Test Replay — '+t.name}),
    el('div',{class:'meta',style:'margin:6px 0 0'},el('span',{},svg(PY),t.file.split('/').pop()),counter,stamp)));
  const img=frames.length?image(frames[0].path,'Recorded application window'):null;
  if(img){img.loading='eager';img.decoding='sync'}
  box.append(el('div',{class:'stage'},img||el('div',{class:'nr'},el('b',{text:'No frames recorded'}),el('div',{text:t.replay?.error||'The replay has no images.'}))));
  box.append(caption);
  const fill=el('div',{class:'fill'}),head=el('div',{class:'head'});
  const track=el('div',{class:'track',role:'slider',tabindex:'0','aria-label':'Playback position','aria-valuemin':'0','aria-valuemax':total.toFixed(2)},
    el('div',{class:'rail2'}),fill,
    ...timed.map((mark,i)=>el('div',{class:'tick '+mark.status,title:`${mark.index+1}. ${mark.name}`,style:`left:${(byTime?mark.start/total:i/segments)*100}%`})),head);
  const fromPointer=event=>{const rect=track.getBoundingClientRect();seek(timeAt((event.clientX-rect.left)/rect.width))};
  track.addEventListener('pointerdown',event=>{stopPlay();track.setPointerCapture(event.pointerId);fromPointer(event)});
  track.addEventListener('pointermove',event=>{if(track.hasPointerCapture(event.pointerId))fromPointer(event)});
  track.addEventListener('pointerup',()=>writeHash());
  const playBtn=el('button',{class:'ctl play',onclick:()=>st.playing!=null?stopPlay():play()});
  const spacing=el('select',{class:'speed','aria-label':'Timeline spacing',title:'How the timeline is laid out',onchange:event=>{st.spacing=event.target.value;renderTrace();writeHash()}},
    el('option',{value:'time',text:'Timeline: real time',selected:byTime}),el('option',{value:'steps',text:'Timeline: equal steps',selected:!byTime}));
  const speed=el('select',{class:'speed','aria-label':'Playback speed',onchange:event=>{st.speed=Number(event.target.value)||1}},
    ...SPEEDS.map(value=>el('option',{value:String(value),text:value+'×',selected:value===(st.speed||1)})));
  box.append(el('div',{class:'controls'},playBtn,
    el('button',{class:'ctl','aria-label':'Previous step',onclick:()=>stepBy(-1)},svg(ICON.prev)),
    el('button',{class:'ctl','aria-label':'Next step',onclick:()=>stepBy(1)},svg(ICON.next)),
    time,track,speed,spacing,
    failed?el('button',{class:'jump',onclick:()=>{stopPlay();seek(replayTimeFor(t,failed.index));writeHash()}},svg(ICON.target),'Jump to failure'):null));
  const thumbs=marks.length?el('div',{class:'thumbs'},...marks.map(mark=>el('button',{class:'thumb '+mark.status,disabled:mark.start==null,
    onclick:()=>{stopPlay();seek(mark.start);writeHash()}},
    mark.shot?image(mark.shot,'Screen after '+mark.name):el('span',{class:'blank',text:mark.status==='not_run'?'Not run':'No frame'}),
    el('div',{class:'tn',title:mark.name,text:`${mark.index+1}. ${mark.name}`}),el('div',{class:'td',text:mark.status==='not_run'?'–':fmt(mark.dur)})))):null;
  if(thumbs)box.append(thumbs);
  let shownMark=null,shownPlaying=null;
  function update(force){
    const index=frames.length?frameAt(frames,st.at):-1,markIndex=markAt(marks,st.at),mark=marks[markIndex];
    if(img){const path=framePath(frames[index].path);if(img.getAttribute('src')!==path)img.setAttribute('src',path);
      for(let next=index+1;next<Math.min(frames.length,index+30);next++)preload(framePath(frames[next].path))}
    const percent=place(st.at)*100;fill.style.width=percent+'%';head.style.left=percent+'%';
    head.classList.toggle('failed',mark?.status==='failed');track.setAttribute('aria-valuenow',st.at.toFixed(2));
    time.textContent=stamp.textContent=`${st.at.toFixed(1)}s / ${total.toFixed(1)}s`;
    if(force||markIndex!==shownMark){shownMark=markIndex;
      counter.textContent=marks.length?(markIndex<0?`Before step 1 of ${marks.length}`:`Step ${markIndex+1} of ${marks.length}`):`Frame ${index+1} of ${frames.length}`;
      caption.replaceChildren(...(mark?[svg(ICON[mark.status]),el('b',{text:`${markIndex+1}. ${mark.name}`}),mark.loc?el('code',{class:'mono muted',text:mark.loc}):null,
        mark.status==='failed'?el('span',{class:'err',text:'— '+(mark.error?.message||t.error.message)}):null]
        :[el('span',{class:'muted',text:marks.length?'Before the first step':'Recorded run'})]).filter(Boolean));
      thumbs?.querySelectorAll('.thumb').forEach((button,i)=>button.classList.toggle('on',i===markIndex));
      const selected=thumbs?.querySelector('.thumb.on');
      if(selected)thumbs.scrollLeft=selected.offsetLeft-thumbs.offsetLeft-(thumbs.clientWidth-selected.clientWidth)/2}
    const playing=st.playing!=null;
    if(force||playing!==shownPlaying){shownPlaying=playing;playBtn.replaceChildren(svg(playing?ICON.pause:ICON.play));playBtn.setAttribute('aria-label',playing?'Pause':'Play')}
  }
  function seek(at){st.at=Math.max(0,Math.min(total,at));update()}
  function stepBy(direction){stopPlay();const starts=marks.filter(mark=>mark.start!=null).map(mark=>mark.start);
    const target=direction>0?starts.find(start=>start>st.at+0.01):starts.filter(start=>start<st.at-0.25).at(-1);
    seek(target??(direction>0?total:0));writeHash()}
  function play(){if(st.at>=total-0.01)st.at=0;let last=performance.now();
    const tick=now=>{st.at=Math.min(total,st.at+(now-last)/1000*(st.speed||1));last=now;
      if(st.at>=total){st.playing=null;update();writeHash();return}
      st.playing=requestAnimationFrame(tick);update()};
    st.playing=requestAnimationFrame(tick);update()}
  replayUi={update,stepBy,play,seek};
  update(true);
}

/* ---------- rail + panels ---------- */
function renderRail(){
  const t=cur();$('#rail').replaceChildren(...PANELS.map(([k,l])=>el('button',{role:'tab',class:st.open&&st.panel===k?'on':'','aria-selected':String(st.open&&st.panel===k),
    onclick:()=>{if(st.open&&st.panel===k)st.open=false;else{st.panel=k;st.open=true}render()}},svg(ICON[k==='tree'?'tree':k]),l)))}

function renderPanel(){
  const t=cur(),p=$('#panel');p.replaceChildren();p.scrollTop=0;
  const [k,l]=PANELS.find(x=>x[0]===st.panel);
  const SUB={diagnostics:'Why the element lookup or check failed, and the closest matches.',tree:'The app\u2019s UI hierarchy when the test failed.',
    output:'What the test printed and logged.',details:'The machine and run this test ran on.'};
  p.append(el('div',{class:'phead'},el('h2',{text:l}),el('button',{class:'x','aria-label':'Close panel',onclick:()=>{st.open=false;render()}},svg(ICON.x))),el('p',{class:'psub',text:SUB[k]}));
  ({diagnostics:diagView,tree:treeView,output:outView,details:detailsView})[k](t,p)}

const nothing=(p,msg)=>p.append(el('div',{class:'ok'},msg));


function render(){
 const app=$('#app');app.classList.toggle('replay',st.view==='replay');app.classList.toggle('panel-closed',!st.open);
 if(!TESTS.length){$('#main').replaceChildren(el('h1',{text:'No tests were recorded.'}));$('#panel').replaceChildren();return}
 if(st.view==='replay')renderTrace();else{stopPlay();renderNav();renderMain();renderRail();if(st.open)renderPanel()}
 writeHash();
}
$('#q').addEventListener('input',event=>{st.q=event.target.value;renderNav()});
window.addEventListener('hashchange',()=>{stopPlay();readHash();render()});
document.addEventListener('keydown',event=>{if(st.view!=='replay'||event.target.matches('input,textarea'))return;
 if(event.key==='Escape'){stopPlay();st.view='test';render()}
 if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();replayUi?.stepBy(event.key==='ArrowRight'?1:-1)}
 if(event.key===' '&&!event.target.matches('button,select')){event.preventDefault();st.playing!=null?stopPlay():replayUi?.play()}
});
const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
const MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>';
function renderThemeToggle(){const button=$('#theme-toggle'),dark=theme.get()==='dark',label=dark?'Switch to light mode':'Switch to dark mode';
  button.replaceChildren(svg(dark?SUN:MOON));button.title=label;button.setAttribute('aria-label',label)}
$('#theme-toggle').addEventListener('click',()=>theme.set(theme.get()==='dark'?'light':'dark'));
theme.onChange(renderThemeToggle);renderThemeToggle();
if(theme.inVsCode){const exportButton=$('#export-html');exportButton.hidden=false;exportButton.addEventListener('click',()=>theme.post({type:'wtk-export'}))}
readHash(decodeURIComponent(document.querySelector('meta[name="wtk-test"]')?.content||''));renderHeader();render();
</script>
