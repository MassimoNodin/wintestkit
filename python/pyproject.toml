[project]
name = "wintestkit"
dynamic = ["version"]
description = "UI test automation for Windows WPF applications"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "comtypes>=1.4.8",
    "pillow>=12.0.0",
    "pytest>=8.3",
    "pyyaml>=6.0.2",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Framework :: Pytest",
]

[project.urls]
Homepage = "https://github.com/MassimoNodin/wintestkit"
Documentation = "https://github.com/MassimoNodin/wintestkit/tree/master/docs/guide"
Repository = "https://github.com/MassimoNodin/wintestkit"
Issues = "https://github.com/MassimoNodin/wintestkit/issues"
Changelog = "https://github.com/MassimoNodin/wintestkit/blob/master/vscode/CHANGELOG.md"

[project.scripts]
wtk = "wintestkit.cli:main"

[project.entry-points.pytest11]
wintestkit = "wintestkit.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/wintestkit/__init__.py"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1.390",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "types-pyyaml>=6.0.12.20260906",
    "twine>=7,<8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # tests embed source snippets and long expected messages

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/unit", "tests/integration"]
markers = [
    "integration: needs an interactive Windows desktop",
    "slow: takes more than 5 seconds",
]
addopts = "-p no:wintestkit --import-mode=importlib"
