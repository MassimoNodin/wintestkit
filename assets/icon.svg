    <linearGradient id="grad-cube-top" gradientUnits="userSpaceOnUse" x1="520" y1="200" x2="697" y2="618">
      <stop stop-color="#ffffff"/><stop offset=".57" stop-color="#fbfdff"/><stop offset="1" stop-color="#f1f6fc"/>
    </linearGradient>
