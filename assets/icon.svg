    <ellipse id="middle-shadow" cx="632" cy="986" rx="266" ry="66" fill="#729bcc" opacity=".21" filter="url(#shadow-ambient)"/>
    <ellipse id="contact-shadow" cx="629" cy="1018" rx="154" ry="31" fill="#5589bf" opacity=".19" filter="url(#shadow-contact)"/>
  </g>

