  <title id="logo-title">WinTestKit — T / W / K isometric cube</title>
  <desc id="logo-description">Editable vector reconstruction of the supplied WinTestKit cube logo. A blue T sits on the top face, a blue W forms the left face, and a charcoal K forms the right face. White separators, graduated bevels, and a soft blue-grey cast shadow preserve the reference appearance. The partially obscured top T has been reconstructed as a clean isometric shape. Every visible element is an SVG path, rectangle, or ellipse; no raster image or font is embedded. Hide the Canvas group for a transparent background.</desc>

